<style>

*{box-sizing:border-box;margin:0}html,body{height:100%}body{background:var(--bg);background-image:var(--bgi);color:var(--t);font:15px/1.5 'IBM Plex Sans Thai',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}

button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--g);outline-offset:2px}
.m{color:var(--m);font-size:13px}.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.logo{font-size:22px;font-weight:700;letter-spacing:-.3px}
.ib{width:42px;height:42px;border-radius:14px;background:var(--p);border:1px solid var(--l);display:grid;place-items:center;position:relative}.ib svg{width:20px}
.bd{position:absolute;top:-4px;right:-4px;background:var(--g);color:#04130c;font:700 11px/18px sans-serif;min-width:18px;border-radius:9px;text-align:center}
.card{background:linear-gradient(160deg,var(--p),var(--p2));border:1px solid var(--l);border-radius:24px;padding:18px;margin-bottom:14px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
h1{font-size:34px;font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums}h2{font-size:20px;margin-bottom:12px}.big{font-size:26px;font-weight:700}
.dw{display:grid;place-items:center;margin:8px 0}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.two b{font-size:20px}
.c-vault{text-align:center}.c-vault .two{text-align:left}
.cta{width:100%;padding:18px;border-radius:20px;background:var(--g);color:#04130c;font-size:20px;font-weight:700;box-shadow:0 8px 24px rgba(46,229,157,.28);display:flex;gap:8px;justify-content:center;align-items:center}.cta svg{width:24px}
.cta:disabled{background:var(--p2);color:var(--m);box-shadow:none;cursor:default}.cta.s{padding:14px;font-size:16px}
.sec{width:100%;padding:14px;border-radius:16px;background:var(--p2);font-weight:600;margin-top:8px}.dg{color:var(--r)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.st{background:var(--p);border:1px solid var(--l);border-radius:18px;padding:14px}.st b{font-size:18px;display:block}
.warn{width:100%;text-align:left;background:rgba(245,197,66,.13);border:1px solid var(--y);color:var(--y);border-radius:16px;padding:12px 14px;margin-bottom:14px;font-weight:500}
.row{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--l);gap:10px}.row:last-child{border:0}.row b{font-variant-numeric:tabular-nums;text-align:right}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:grid;grid-template-columns:repeat(5,1fr);background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(16px);border-top:1px solid var(--l);padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px))}
.nav button{display:grid;justify-items:center;gap:2px;font-size:11px;color:var(--m);padding:4px}.nav svg{width:22px}.nav .on{color:var(--g)}
svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.dial,.dial *{stroke:none}
.cal{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.cell{border-radius:14px;padding:8px 2px;text-align:center;background:var(--p);border:1px solid var(--l);font-size:12px;color:var(--m)}.cell b{display:block;font-size:14px;color:var(--t)}
.cell.p{background:rgba(46,229,157,.16);border-color:var(--g)}.cell.t{background:rgba(245,197,66,.18);border-color:var(--y)}.cell.m{background:rgba(255,107,107,.15);border-color:var(--r)}.cell.c{border:1px dashed var(--g)}
.lg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--m);margin-bottom:12px}.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
input.in{width:100%;background:var(--p);border:1px solid var(--l);border-radius:18px;padding:16px;font:700 28px 'IBM Plex Sans Thai';color:var(--t)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.chips button{padding:8px 12px;border-radius:12px;background:var(--p2);font-size:13px}
.er{color:var(--r);background:rgba(255,107,107,.1);border-radius:14px;padding:12px}
.tg{width:48px;height:28px;border-radius:14px;background:var(--p2);position:relative;transition:.2s;flex:none}.tg:after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}.tg.on{background:var(--g)}.tg.on:after{left:23px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:9}.sheet{background:var(--p);width:100%;max-width:480px;border-radius:28px 28px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px));animation:up .22s}
@keyframes up{from{transform:translateY(40px);opacity:0}}
#toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:20;padding:12px 18px;border-radius:16px;background:var(--g);color:#04130c;font-weight:600;max-width:90%}#toast.e{background:var(--r);color:#fff}
.ctr{min-height:100vh;display:grid;place-content:center;text-align:center;gap:10px;padding:24px}.ob{min-height:100vh;display:flex;flex-direction:column;justify-content:space-between;padding:32px 20px}
.dots{display:flex;gap:6px;justify-content:center;margin:16px 0}.dots i{width:8px;height:8px;border-radius:4px;background:var(--p2)}.dots i.on{width:24px;background:var(--g)}
.back{display:flex;gap:6px;align-items:center;color:var(--m);margin-bottom:12px}.back svg{width:20px}.pulse{animation:pl 1.2s infinite}@keyframes pl{50%{opacity:.5}}
.ni{padding:14px 0;border-bottom:1px solid var(--l)}.ni.u{border-left:3px solid var(--g);padding-left:12px}
.wc{background:#fff;color:#0d2a1d;border:0}.wc .m{color:#5b6f65}.three{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;gap:6px;margin-top:16px}.three b{display:block;font-size:14px}.three span{font-size:24px}
.trw{display:grid;grid-template-columns:48px 1fr 100px;width:100%;text-align:left;padding:11px 4px;border-bottom:1px solid #e3ece7;font-variant-numeric:tabular-nums}.trw span:last-child{text-align:right}
.sl{width:100%;padding:12px;border-radius:12px;border:1px solid #d6e3dc;font:inherit;margin-bottom:8px;background:#fff;color:#0d2a1d}.rd{display:flex;gap:10px;padding:14px;border-radius:14px;background:var(--p2);margin-top:8px}
.card,.st,.sheet,.sw{--t:#0d2a1d;--m:#5b6f65;--l:#e3ece7;--p2:#eef4f0;--p:#fff;background:#fff;color:#0d2a1d;border:0;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.card.dk{--t:#f2f8f4;--m:#9fc2b0;--l:rgba(255,255,255,.12);--p2:#17402f;--p:#0e2a1f;background:linear-gradient(160deg,color-mix(in srgb,var(--g) 24%,#06180f),color-mix(in srgb,var(--g) 12%,#06180f));color:#f2f8f4}
.sw{margin:6px -16px -100px;padding:20px 16px 110px;border-radius:30px 30px 0 0;min-height:max(300px,calc(100vh - 470px));box-shadow:none}
.cta:not(:disabled){background:linear-gradient(180deg,var(--g),var(--gd));color:#fff;box-shadow:0 6px 16px color-mix(in srgb,var(--g) 40%,transparent)}.ob .cta{background:var(--gl);color:#06180f;box-shadow:none}
.nav{background:#fff;border-radius:24px 24px 0 0;border:0;box-shadow:0 -6px 24px rgba(0,0,0,.2)}.nav button{color:#7b8f85}.nav .on{color:var(--gd);font-weight:600}
main{position:relative}main>h2{text-align:center;font-size:18px;margin:8px 0 18px}.back{position:absolute;top:18px;left:12px;font-size:0;z-index:2;color:var(--t)}.back svg{width:26px;height:26px}
.cell{background:#fff}.sec{color:var(--t)}
:root{--gd:color-mix(in srgb,var(--g) 62%,#000);--gl:color-mix(in srgb,var(--g) 55%,#fff);--gt:color-mix(in srgb,var(--g) 14%,#fff)}
.rb{position:absolute;bottom:0;font:600 15px 'IBM Plex Sans Thai';color:#fff;padding:10px 14px;border-radius:14px;background:rgba(255,255,255,.12)}.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.gc{border-radius:12px;padding:6px 4px;text-align:left;border:1.5px solid #e3e6ea;background:#fff;font-size:10px;line-height:1.35;color:#5b6f65;min-width:0}.gc b{display:block;font-size:13px;color:#0d2a1d}.gc span{display:block;white-space:nowrap}.gc.p{background:var(--gt);border-color:color-mix(in srgb,var(--g) 55%,#fff)}.gc.t{background:#fff6d6;border-color:#f2d462}.gc.m{background:#ffe9e9;border-color:#ff9b9b}.gc.c{border-style:dashed;border-color:var(--g)}.gc.tdy{outline:2.5px solid #0d2a1d;outline-offset:-1px}
.ob .ctr{min-height:60vh}[hidden]{display:none!important}#ub{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:15;display:flex;gap:14px;align-items:center;background:#0d2a1d;color:#fff;border:1px solid var(--g);padding:10px 16px;border-radius:16px;white-space:nowrap}#ub button{color:var(--gl);font-weight:700}
.wt{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;padding-bottom:4px}.wt button{flex:none;padding:8px 14px;border-radius:20px;background:rgba(255,255,255,.12);color:#e6f4ec;font-size:14px}.wt .on{background:var(--g);color:#06180f;font-weight:600}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div id="app"></div><div id="md"></div><div id="toast" hidden></div><div id="ub" hidden></div>
<script>
const K='armvault_v2',$=s=>document.querySelector(s),f=n=>'฿'+Math.round(n).toLocaleString('en-US');
const D=()=>({onboarded:false,goal:0,name:'กระเป๋าหลัก',icon:'💰',mode:'lad',m:0,W:[],a:0,notes:{},bonus:[],start:Date.now(),day:1,paid:{},fixed:{},extra:{},st:{notif:true,sound:true,theme:'dark',pin:'',acc:'#3be384',time:'08:00'},notifs:[]});
let S,route='home',loading=true,ul=false,ob=0,obg='',bad=0;
try{S=Object.assign(D(),JSON.parse(localStorage.getItem(K)||'{}'));S.st=Object.assign(D().st,S.st)}catch(e){S=D();bad=1}if(S.W&&S.W[S.a])Object.assign(S,S.W[S.a]);
const save=()=>{sync();try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const md=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()};
const cur=()=>{if(S.mode=='fix'){const a=new Date(S.start),b=new Date();return(b.getFullYear()-a.getFullYear())*12+b.getMonth()-a.getMonth()+1}return Math.floor((md(Date.now())-md(S.start))/864e5)+1},tick=()=>{const c=cur();if(c>S.day)S.day=c};
const F=['name','icon','mode','m','goal','start','day','paid','fixed','extra','notes','bonus'],pick=()=>Object.fromEntries(F.map(k=>[k,S[k]])),sync=()=>{S.W[S.a]=pick()},WD=()=>{const d=D();return Object.fromEntries(F.map(k=>[k,d[k]]))};
const amt=k=>S.mode!='lad'?S.m:k,cum=n=>S.mode!='lad'?n*S.m:n*(n+1)/2,minN=g=>S.mode!='lad'?Math.ceil(g/S.m):minDays(g),sv=w=>Object.values(w.paid).reduce((a,b)=>a+b,0)+(w.bonus||[]).reduce((a,b)=>a+b.a,0),th=h=>S.mode=='fix'?h.replace(/วันที่ /g,'งวดที่ ').replace(/(\d) วัน/g,'$1 เดือน').replace(/ต่อวัน/g,'ต่อเดือน').replace(/>วันที่</g,'>งวดที่<'):h,snap=()=>{sync();return JSON.stringify(S)};
const minDays=g=>{let n=Math.ceil((Math.sqrt(8*g+1)-1)/2);while(n*(n+1)/2<g)n++;while(n>1&&(n-1)*n/2>=g)n--;return n};
const saved=()=>paidSum()+bsum(),paidSum=()=>Object.values(S.paid).reduce((a,b)=>a+b,0),bsum=()=>(S.bonus||[]).reduce((a,b)=>a+b.a,0),isPaid=d=>S.paid[d]!=null,due=()=>amt(S.day)+(S.extra[S.day]||0);
const missed=()=>{const a=[];for(let d=1;d<S.day;d++)if(!isPaid(d)&&!S.fixed[d])a.push(d);return a};
const streak=()=>{let d=isPaid(S.day)?S.day:S.day-1,c=0;while(d>=1&&isPaid(d)){c++;d--}return c};
const maxStreak=()=>{let b=0,c=0;for(let d=1;d<=S.day;d++){c=isPaid(d)?c+1:0;b=Math.max(b,c)}return b};
const dd=k=>{if(S.mode=='fix'){const d=new Date();d.setMonth(d.getMonth()+k-S.day);return d}return new Date(md(Date.now())+(k-S.day)*864e5)},fd=k=>dd(k).toLocaleDateString('th-TH-u-ca-gregory',{day:'numeric',month:'short',year:'numeric'});
function plan(g){const R=Math.max(0,g-saved()),sd=isPaid(S.day)?S.day+1:S.day;let m=0;if(S.mode!='lad'){m=Math.ceil(R/S.m);return{R,sd,m,last:sd+m-1,tot:saved()+m*S.m,end:m?fd(sd+m-1):'ถึงเป้าหมายแล้ว'}}if(R>0){let k=S.day,sum=0;while(sum<R){if(!isPaid(k)){sum+=k;m++}k++}return{R,sd,m,last:k-1,tot:saved()+sum,end:fd(k-1)}}if(0){const b=2*sd-1;m=Math.ceil((-b+Math.sqrt(b*b+8*R))/2);while(m*(2*sd+m-1)/2<R)m++;while(m>1&&(m-1)*(2*sd+m-2)/2>=R)m--}
return{R,sd,m,last:sd-1,tot:saved()+m*(2*sd+m-1)/2,end:m?fd(sd+m-1):'ถึงเป้าหมายแล้ว'}}
const ICO={home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',cal:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 11h18"/>',chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',set:'<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>',bell:'<path d="M6 9a6 6 0 0112 0c0 6 3 7 3 7H3s3-1 3-7M10 20a2 2 0 004 0"/>',check:'<path d="M5 12l5 5 9-10"/>',flame:'<path d="M12 3c1 4 5 5 5 10a5 5 0 01-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-9z"/>',back:'<path d="M15 5l-7 7 7 7"/>'};
const ic=n=>`<svg viewBox="0 0 24 24" width="22" height="22">${ICO[n]}</svg>`;
function dial(p,sz=230){const c=2*Math.PI*84;let t='';for(let i=0;i<60;i++)t+=`<line x1="115" y1="6" x2="115" y2="${i%5?12:19}" transform="rotate(${i*6} 115 115)" stroke="var(--m)" stroke-opacity="${i%5?.35:.85}" stroke-width="${i%5?1.2:2.4}" style="stroke:var(--m)"/>`;
return`<svg class="dial" viewBox="0 0 230 230" width="${sz}" height="${sz}"><g style="transform-origin:115px 115px;transform:rotate(${p*3.6}deg);transition:transform .9s cubic-bezier(.2,.8,.2,1)">${t}</g><circle cx="115" cy="115" r="84" fill="none" style="stroke:var(--p2);stroke-width:12"/><circle cx="115" cy="115" r="84" fill="none" style="stroke:var(--g);stroke-width:12;stroke-linecap:round;stroke-dasharray:${c*p/100} ${c};transition:stroke-dasharray .9s" transform="rotate(-90 115 115)"/><circle cx="115" cy="115" r="62" style="fill:var(--bg);stroke:var(--l);stroke-width:1"/><text x="115" y="122" text-anchor="middle" style="fill:var(--t);font:700 34px 'IBM Plex Sans Thai'">${Math.floor(p)}%</text><text x="115" y="144" text-anchor="middle" style="fill:var(--m);font:12px 'IBM Plex Sans Thai'">ในตู้เซฟ</text></svg>`}
const row=(a,b)=>`<div class="row"><span class="m">${a}</span><b>${b}</b></div>`;
const unread=()=>S.notifs.filter(n=>!n.r).length;
function note(k,t){if(!S.st.notif||S.notifs.some(n=>n.k==k))return;S.notifs.unshift({k,t,ts:Date.now(),r:0});S.notifs=S.notifs.slice(0,40)}
function auto(){if(!isPaid(S.day)&&saved()<S.goal)note('due'+S.a+'_'+S.day,`${S.name}: วันนี้คุณต้องออม ${f(due())}`);const m=missed();if(m.length)note('miss'+S.a+'_'+S.day,'คุณยังไม่ได้ออมวันนี้ (พลาดวันที่ '+m[0]+')')}
function toast(t,e){const x=$('#toast');x.textContent=t;x.className=e?'e':'';x.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>x.hidden=true,2400)}
function M(h){$('#md').innerHTML=h?`<div class="ov" onclick="if(event.target==this)M()"><div class="sheet">${th(h)}</div></div>`:''}
function beep(){if(!S.st.sound)return;try{const a=new AudioContext(),o=a.createOscillator(),g=a.createGain();o.frequency.value=880;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.15,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.3);o.start();o.stop(a.currentTime+.3)}catch(e){}}
const go=r=>{route=r;render();scrollTo(0,0)};

const home=()=>{const s=saved(),g=S.goal,p=Math.min(100,s/g*100),pd=isPaid(S.day),ms=missed(),pl=plan(g),done=s>=g;
return`<div class="hd"><div><div class="logo">ArmVault</div><p class="m">ออมวันนี้ เพื่อเป้าหมายที่ใหญ่กว่า</p></div><button class="ib" aria-label="การแจ้งเตือน" onclick="go('notif')">${ic('bell')}${unread()?`<i class="bd">${unread()}</i>`:''}</button></div>
${ms.length?`<button class="warn" onclick="A.flex()">คุณพลาดการออมวันที่ ${ms[0]}${ms.length>1?` และอีก ${ms.length-1} วัน`:''} · แตะเพื่อจัดการ</button>`:''}
<section class="card c-vault"><p class="m">เป้าหมายของฉัน</p><h1>${f(g)}</h1><div class="dw">${dial(p)}</div><div class="two"><div><p class="m">ออมแล้ว</p><b>${f(s)}</b></div><div><p class="m">เหลือ</p><b>${f(Math.max(0,g-s))}</b></div></div></section>
<section class="card"><p class="m">วันนี้ · วันที่ ${S.day}</p>${done?`<p class="big" style="margin:6px 0 14px">ถึงเป้าหมายแล้ว 🎉</p><button class="sec" onclick="go('edit')">ตั้งเป้าหมายใหม่</button>`:`<p class="m" style="margin-top:6px">วันนี้ต้องออม</p><p class="big" style="margin-bottom:14px">${f(due())}</p>${pd?`<button class="cta" disabled>${ic('check')} ออมแล้ววันนี้</button>`:`<button class="cta" onclick="A.pay()">${ic('check')} ออมแล้ว</button>`}`}</section>
<div class="grid2"><div class="st"><p class="m">ออมต่อเนื่อง</p><b style="color:var(--y)">🔥 ${streak()} วัน</b></div><div class="st"><p class="m">ออมแล้ว</p><b>${Object.keys(S.paid).length} วัน</b></div><div class="st"><p class="m">เหลืออีก</p><b>${pl.m} วัน</b></div><div class="st"><p class="m">คาดว่าจะถึงเป้าหมาย</p><b style="font-size:15px">${pl.end}</b></div></div>`};

const goal=()=>{const s=saved(),g=S.goal,p=Math.min(100,s/g*100),pl=plan(g);

if(!(g>=1&&g<=1e9))return`<p class="er">กรอกจำนวนเงินตั้งแต่ ฿1 ถึง ฿1,000,000,000</p>`;
if(g<=s)return`<p class="er">เป้าหมายต้องมากกว่ายอดที่ออมแล้ว (${f(s)})</p>`;
bad2=0;const n=minN(g),t=cum(n),q=plan(g);
return`<div class="card" style="margin:0">${row('เป้าหมายใหม่',f(g))}${row('จำนวนวันที่ต้องออม',n+' วัน')}${row('ยอดสะสมเมื่อครบ',f(t))}${row('ยอดเกินเป้าหมาย',f(t-g))}${s?row('ออมแล้ว',f(s))+row('เหลือ',f(g-s))+row('วันปัจจุบัน','วันที่ '+S.day)+row('เหลืออีก',q.m+' วัน'):''}</div>`}

return`<h2>ตารางออม</h2><div class="lg"><span><i style="background:var(--g)"></i>ออมแล้ว</span><span><i style="background:var(--y)"></i>วันนี้</span><span><i style="background:var(--p2)"></i>ยังไม่ถึง</span><span><i style="background:var(--r)"></i>พลาด</span></div><div class="cal">${h}</div>`};

const stats=()=>{const ks=Object.keys(S.paid).map(Number);if(!ks.length)return`<h2>สถิติ</h2><div class="card ctr" style="min-height:0"><p class="big">ยังไม่มีข้อมูล</p><p class="m">กด “ออมแล้ว” วันแรก แล้วกราฟจะเริ่มขึ้นที่นี่</p><button class="cta s" onclick="go('home')">ไปหน้าหลัก</button></div>`;
const n=minN(S.goal),N=Math.max(n,S.day),ymax=Math.max(S.goal,cum(N)),W=320,H=170,X=d=>10+(W-20)*d/N,Y=v=>H-8-(H-20)*v/ymax;let c=0,a='',ide='';for(let d=1;d<=S.day;d++){c+=S.paid[d]||0;a+=(d>1?' ':'')+X(d).toFixed(1)+','+Y(c).toFixed(1)}
for(let d=0;d<=N;d+=Math.max(1,Math.floor(N/60)))ide+=X(d).toFixed(1)+','+Y(cum(d)).toFixed(1)+' ';
let best=ks.reduce((b,k)=>S.paid[k]>S.paid[b]?k:b,ks[0]),mis=0;for(let d=1;d<S.day;d++)if(!isPaid(d)&&S.fixed[d]!='comp'&&S.fixed[d]!='spread')mis++;
return`<h2>สถิติ</h2><section class="card"><p class="m">ยอดเงินสะสมตามวัน</p><svg viewBox="0 0 ${W} ${H}" width="100%" style="margin:8px 0"><line x1="10" x2="${W-10}" y1="${Y(S.goal)}" y2="${Y(S.goal)}" style="stroke:var(--y);stroke-dasharray:4 4;stroke-width:1.5"/><polyline points="${ide}" style="stroke:var(--m);stroke-opacity:.5;stroke-width:1.5;stroke-dasharray:2 4"/><polyline points="${a}" style="stroke:var(--g);stroke-width:3"/><text x="12" y="${Y(S.goal)-5}" style="fill:var(--y);font:11px 'IBM Plex Sans Thai';stroke:none">เป้าหมาย ${f(S.goal)}</text></svg><div class="lg"><span><i style="background:var(--g)"></i>ยอดสะสมจริง (วันที่ 1–${S.day})</span><span><i style="background:var(--m)"></i>แผนเต็ม</span></div></section>
<div class="grid2"><div class="st"><p class="m">ยอดออมทั้งหมด</p><b>${f(saved())}</b></div><div class="st"><p class="m">ค่าเฉลี่ยต่อวัน</p><b>${f(saved()/ks.length)}</b></div><div class="st"><p class="m">วันที่ออมดีที่สุด</p><b>วันที่ ${best} · ${f(S.paid[best])}</b></div><div class="st"><p class="m">Streak สูงสุด</p><b>🔥 ${maxStreak()} วัน</b></div><div class="st"><p class="m">ออมสำเร็จ</p><b>${ks.length} วัน</b></div><div class="st"><p class="m">พลาด</p><b>${mis} วัน</b></div></div>`};

`<div class="ctr"><p class="m">วันที่ 1 · วันที่ 2 · วันที่ 3</p><h1>฿1 → ฿2 → ฿3</h1><h2>เริ่มจาก 1 บาท<br>แล้วเพิ่มขึ้นวันละ 1 บาท</h2></div>`,
`<div style="padding-top:40px"><h2>ตั้งเป้าหมายของคุณ</h2><input id="gi" class="in" inputmode="numeric" value="${obg}" placeholder="เช่น 100000" oninput="this.value=this.value.replace(/\\D/g,'');obg=this.value;A.obp()"><div id="pv" style="margin-top:14px"></div></div>`];
return`<div class="ob"><div>${pg[ob]}</div><div><div class="dots">${[0,1,2].map(i=>`<i class="${i==ob?'on':''}"></i>`).join('')}</div><button id="cf" class="cta" onclick="A.nx()">${ob<2?'ถัดไป':'เริ่มออม'}</button></div></div>`};

const A={
pay(){if(isPaid(S.day))return;S.paid[S.day]=due();const s=streak();beep();if(s==7||s==30||s==100)note('sk'+S.a+'_'+s,`🔥 คุณออมต่อเนื่องครบ ${s} วันแล้ว!`);toast('ออมแล้ว '+f(S.paid[S.day])+' เข้าตู้เซฟ');
if(saved()>=S.goal){note('goal'+S.a+'_'+S.goal,'🎉 ถึงเป้าหมาย '+f(S.goal)+' แล้ว');M(`<h2>ถึงเป้าหมายแล้ว 🎉</h2><p class="m">คุณออมครบ ${f(S.goal)} ใน ArmVault</p><button class="cta s" style="margin-top:14px" onclick="M()">เยี่ยมเลย</button>`)}render()},
flex(){const m=missed();if(!m.length)return;const d=m[0],a=d;M(`<h2>คุณพลาดการออมวันที่ ${d}</h2><p class="m">ยอดที่ขาด ${f(a)}${m.length>1?` · ยังมีอีก ${m.length-1} วัน`:''}</p><button class="cta s" style="margin-top:14px" onclick="A.fx(${d},'comp')">ชดเชยวันนี้ (+${f(a)})</button><button class="sec" onclick="A.fx(${d},'spread')">กระจายยอดที่ขาด (5 วันข้างหน้า)</button><button class="sec" onclick="A.fx(${d},'skip')">ข้ามวันนี้</button>`)},
fx(d,t){S.fixed[d]=t;if(t=='comp')S.extra[S.day]=(S.extra[S.day]||0)+amt(d);if(t=='spread'){const a=Math.ceil(amt(d)/5);for(let i=1;i<=5;i++)S.extra[S.day+i]=(S.extra[S.day+i]||0)+a;toast('เพิ่มวันละ '+f(a)+' อีก 5 วัน')}else toast(t=='comp'?'วันนี้ต้องออม '+f(due()):'ข้ามวันที่ '+d+' แล้ว');M();render()},
day(d){const s=stN(d),L={p:'ออมแล้ว',t:'วันนี้',f:'ยังไม่ถึง',m:'พลาด',c:'ชดเชยแล้ว'}[s];M(`<h2>วันที่ ${d}</h2>${row('จำนวนเงิน',f(amt(d)))}${row('วันที่',fd(d))}${row('สถานะ',L)}${isPaid(d)?row('ออมจริง',f(S.paid[d])):''}${S.extra[d]?row('ยอดเพิ่ม',f(S.extra[d])):''}${s=='t'?`<button class="cta s" style="margin-top:12px" onclick="M();A.pay()">ออมแล้ว</button>`:''}${s=='m'&&!S.fixed[d]?`<button class="sec" onclick="M();A.flex()">จัดการวันที่พลาด</button>`:''}<button class="sec" onclick="M()">ปิด</button>`)},
prev(v){$('#pv').innerHTML=pv(v);$('#cf').disabled=!!bad2},set(v){$('#gi').value=v;A.prev(v)},
cfm(){const g=Math.floor(+$('#gi').value);if(bad2)return toast('กรอกเป้าหมายให้ถูกต้อง',1);const q=plan(g);M(`<h2>ยืนยันเป้าหมายใหม่</h2><p class="m">เปลี่ยนจาก ${f(S.goal)} เป็น ${f(g)}</p>${row('เหลืออีก',q.m+' วัน')}${row('ยอดที่ออมแล้ว',f(saved()))}<p class="m" style="margin-top:8px">ยอดที่ออมไปแล้วจะไม่ถูกรีเซ็ต</p><button class="cta s" style="margin-top:14px" onclick="A.ok(${g})">ยืนยันเป้าหมาย</button><button class="sec" onclick="M()">ยกเลิก</button>`)},
ok(g){S.goal=g;note('g'+Date.now(),'อัปเดตเป้าหมายเป็น '+f(g));M();toast('บันทึกเป้าหมายใหม่แล้ว');go('goal')},
tog(k){S.st[k]=!S.st[k];render()},theme(){S.st.theme=S.st.theme=='light'?'dark':'light';render()},
pin(){if(S.st.pin)return M(`<h2>ปิด PIN?</h2><button class="cta s" onclick="S.st.pin='';M();render()">ปิด PIN</button><button class="sec" onclick="M()">ยกเลิก</button>`);M(`<h2>ตั้ง PIN 4 หลัก</h2><input id="pn" class="in" inputmode="numeric" maxlength="4" style="text-align:center" oninput="this.value=this.value.replace(/\\D/g,'')"><button class="cta s" style="margin-top:14px" onclick="A.sp()">บันทึก PIN</button>`)},
sp(){const v=$('#pn').value;if(v.length!=4)return toast('PIN ต้องมี 4 หลัก',1);S.st.pin=v;ul=true;M();toast('ตั้ง PIN แล้ว');render()},
unl(el){if(el.value==S.st.pin){ul=true;render()}else if(el.value.length==4){el.value='';toast('PIN ไม่ถูกต้อง ลองอีกครั้ง',1)}},

rs2(){try{localStorage.removeItem(K)}catch(e){}S=D();ob=0;obg='';route='home';ul=false;M();render()},

const home2=()=>{const s=saved(),g=S.goal,p=Math.min(100,s/g*100),pd=isPaid(S.day),ms=missed(),pl=plan(g),done=s>=g,dn=Object.keys(S.paid).length;
return`<div class="hd"><div class="logo">🌱 ArmVault</div><button class="ib" aria-label="การแจ้งเตือน" onclick="go('notif')">${ic('bell')}${unread()?`<i class="bd">${unread()}</i>`:''}</button></div>
${ms.length?`<button class="warn" onclick="A.flex()">คุณพลาดการออมวันที่ ${ms[0]}${ms.length>1?` และอีก ${ms.length-1} วัน`:''} · แตะเพื่อจัดการ</button>`:''}
<div class="c-vault"><p class="m">เป้าหมาย</p><h1>${f(g)}</h1><div class="dw">${dial(p)}</div><div class="two" style="margin-bottom:14px"><div><p class="m">ออมแล้ว</p><b>${f(s)}</b></div><div><p class="m">เหลือ</p><b>${f(Math.max(0,g-s))}</b></div></div></div>
<section class="card wc"><div class="two"><div><p class="m">เหลืออีก</p><b>${pl.m} วัน</b></div><div><p class="m">ต้องออมวันนี้ · วันที่ ${S.day}</p><b>${f(due())}</b></div></div><div style="height:12px"></div>${done?`<button class="sec" onclick="go('edit')">🎉 ถึงเป้าหมายแล้ว · ตั้งเป้าหมายใหม่</button>`:pd?`<button class="cta" disabled>${ic('check')} ออมแล้ววันนี้</button>`:`<button class="cta" onclick="A.pay()">${ic('check')} ออมแล้ว</button>`}
