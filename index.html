<script>
const K='armvault_v2',$=s=>document.querySelector(s),f=n=>'฿'+Math.round(n).toLocaleString('en-US');
const D=()=>({onboarded:false,goal:0,name:'กระเป๋าหลัก',icon:'💰',mode:'lad',m:0,base:0,bs:0,pdv:0,W:[],a:0,notes:{},bonus:[],wd:[],start:Date.now(),day:1,paid:{},fixed:{},extra:{},st:{notif:true,sound:true,theme:'dark',pin:'',acc:'#3be384',time:'08:00'},notifs:[]});
let S,route='home',loading=true,ul=false,ob=0,obg='',bad=0;
try{S=Object.assign(D(),JSON.parse(localStorage.getItem(K)||'{}'));S.st=Object.assign(D().st,S.st)}catch(e){S=D();bad=1}if(S.W&&S.W[S.a])Object.assign(S,S.W[S.a]);
const save=()=>{sync();try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const md=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()};
const cur=()=>{if(S.mode=='fix'){const a=new Date(S.start),b=new Date();return(b.getFullYear()-a.getFullYear())*12+b.getMonth()-a.getMonth()+1}return Math.floor((md(Date.now())-md(S.start))/864e5)+1},tick=()=>{const c=cur();if(c>S.day)S.day=c};
const F=['name','icon','mode','m','goal','start','day','paid','fixed','extra','notes','bonus','wd','locked','base','bs','pdv'],pick=()=>Object.fromEntries(F.map(k=>[k,S[k]])),sync=()=>{S.W[S.a]=pick()},WD=()=>{const d=D();return Object.fromEntries(F.map(k=>[k,d[k]]))};
const am0=k=>S.mode!='lad'?S.m:k,amt=k=>S.pdv&&k==S.pdv&&poolP()>0?poolX():am0(k),cum=n=>S.mode!='lad'?n*S.m:n*(n+1)/2,minN=g=>S.mode!='lad'?Math.ceil(g/S.m):minDays(g),sv=w=>Object.values(w.paid).reduce((a,b)=>a+b,0)+(w.bonus||[]).reduce((a,b)=>a+b.a,0)-(w.wd||[]).reduce((a,b)=>a+b.a,0),th=h=>S.mode=='fix'?h.replace(/วันที่ /g,'งวดที่ ').replace(/(\d) วัน/g,'$1 เดือน').replace(/ต่อวัน/g,'ต่อเดือน').replace(/>วันที่</g,'>งวดที่<'):h,snap=()=>{sync();return JSON.stringify(S)};
const minDays=g=>{let n=Math.ceil((Math.sqrt(8*g+1)-1)/2);while(n*(n+1)/2<g)n++;while(n>1&&(n-1)*n/2>=g)n--;return n};
const saved=()=>paidSum()+bsum()-wsum(),wsum=()=>(S.wd||[]).reduce((a,b)=>a+b.a,0),paidSum=()=>Object.values(S.paid).reduce((a,b)=>a+b,0),bsum=()=>(S.bonus||[]).reduce((a,b)=>a+b.a,0),isPaid=d=>S.paid[d]!=null,due=()=>amt(S.day)+(S.extra[S.day]||0);const dayAmt=d=>isPaid(d)?S.paid[d]:amt(d)+(S.extra[d]||0);
const missed=()=>{const a=[];for(let d=(S.base||0)+1;d<S.day;d++)if(!isPaid(d)&&!S.fixed[d])a.push(d);return a};

function poolX(){const P=poolP();if(!P)return 0;return Math.max(0,S.goal-plan0(S.goal,P).tot)}
const poolDays=()=>Object.keys(S.fixed).filter(k=>S.fixed[k]=='pool').map(Number).sort((a,b)=>a-b).join(', ');
const PN=d=>{if(!poolP())return'';if(d==S.pdv&&!isPaid(d)){const x=amt(d);return row('วันรวมยอดชดเชย','ออม '+f(x))+row('รวมจากวันที่',poolDays())+row('ยอดที่ข้ามรวม',f(poolP()))+(x<poolP()?'<p class="m">ออมเฉพาะส่วนที่ขาด ส่วนที่เหลือไม่ต้องออม เพราะยอดสะสมเกินเป้าอยู่แล้ว</p>':'')}if(S.fixed[d]=='pool')return row('หมายเหตุ',S.pdv?'ไปรวมไว้วันที่ '+S.pdv:'ไม่ต้องออมเพิ่ม ยอดสะสมถึงเป้าตามเดิม');return''};
const poolCard=()=>{const P=poolP();if(!P||(S.pdv&&isPaid(S.pdv)))return'';const pl=plan(S.goal);let h='<section class="card" style="border:1px dashed #e08a00"><b>📌 วันรวมยอดชดเชย</b>';if(pl.pd)h+=row('วันรวม','วันที่ '+pl.pd+' · '+fd(pl.pd))+row('ยอดที่ต้องออมวันนั้น',f(pl.pm));else if(S.pdv&&S.pdv<S.day)h+=row('วันรวม','วันที่ '+S.pdv+' ยังไม่ได้ออม')+row('ยอดที่ต้องออม',f(amt(S.pdv)));else h+=row('สถานะ','ไม่ต้องมีวันรวม · ถึงเป้าตามเดิม');return h+row('ยอดที่ข้ามรวม',f(P))+row('รวมจากวันที่',poolDays())+'</section>'};
function poolP(){let s=0;for(const k in S.fixed)if(S.fixed[k]=='pool')s+=am0(+k);return s}
const poolUp=()=>poolP()>0&&!(S.pdv&&isPaid(S.pdv))&&(!S.pdv||S.pdv>=S.day);
function syncPool(){const P=poolP();if(!P){if(S.pdv)S.pdv=0;return}if(S.pdv&&isPaid(S.pdv)){for(const d in S.fixed)if(S.fixed[d]=='pool')S.fixed[d]='pooled';S.pdv=0;return}if(!S.pdv||S.pdv>=S.day){const p=plan0(S.goal,P);S.pdv=S.goal>saved()&&S.goal-p.tot>0?p.last+1:0}}
function plan(g){const R0=Math.max(0,g-saved());if(!poolUp()||R0<=0)return plan0(g,0);const P=poolP(),p=plan0(g,P),X=Math.max(0,g-p.tot);if(!X)return Object.assign({},p,{R:R0});const PD=p.last+1;return Object.assign({},p,{R:R0,m:p.m+1,last:PD,pd:PD,pm:X,tot:p.tot+X,end:fd(PD)})}
const streak=()=>{let d=isPaid(S.day)?S.day:S.day-1,c=0;while(d>=1&&isPaid(d)){c++;d--}return c};
const maxStreak=()=>{let b=0,c=0;for(let d=1;d<=S.day;d++){c=isPaid(d)?c+1:0;b=Math.max(b,c)}return Math.max(b,S.bs||0)};
const dd=k=>{if(S.mode=='fix'){const d=new Date();d.setMonth(d.getMonth()+k-S.day);return d}return new Date(md(Date.now())+(k-S.day)*864e5)},fd=k=>dd(k).toLocaleDateString('th-TH-u-ca-gregory',{day:'numeric',month:'short',year:'numeric'});
function plan0(g,P=0){const R=Math.max(0,g-saved()-P),sd=isPaid(S.day)?S.day+1:S.day;let m=0;if(S.mode!='lad'){m=Math.ceil(R/S.m);return{R,sd,m,last:sd+m-1,tot:saved()+m*S.m,end:m?fd(sd+m-1):'ถึงเป้าหมายแล้ว'}}if(R>0){let k=S.day,sum=0;while(sum<R){if(!isPaid(k)){sum+=k;m++}k++}return{R,sd,m,last:k-1,tot:saved()+sum,end:fd(k-1)}}if(0){const b=2*sd-1;m=Math.ceil((-b+Math.sqrt(b*b+8*R))/2);while(m*(2*sd+m-1)/2<R)m++;while(m>1&&(m-1)*(2*sd+m-2)/2>=R)m--}
return{R,sd,m,last:sd-1,tot:saved()+m*(2*sd+m-1)/2,end:m?fd(sd+m-1):'ถึงเป้าหมายแล้ว'}}
const ICO={home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',cal:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 11h18"/>',chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',set:'<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>',bell:'<path d="M6 9a6 6 0 0112 0c0 6 3 7 3 7H3s3-1 3-7M10 20a2 2 0 004 0"/>',check:'<path d="M5 12l5 5 9-10"/>',flame:'<path d="M12 3c1 4 5 5 5 10a5 5 0 01-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-9z"/>',back:'<path d="M15 5l-7 7 7 7"/>'};
const ic=n=>`<svg viewBox="0 0 24 24" width="22" height="22">${ICO[n]}</svg>`;
function dial(p,sz=230){const c=2*Math.PI*84;let t='';for(let i=0;i<60;i++)t+=`<line x1="115" y1="6" x2="115" y2="${i%5?12:19}" transform="rotate(${i*6} 115 115)" stroke="var(--m)" stroke-opacity="${i%5?.35:.85}" stroke-width="${i%5?1.2:2.4}" style="stroke:var(--m)"/>`;
return`<svg class="dial" viewBox="0 0 230 230" width="${sz}" height="${sz}"><g style="transform-origin:115px 115px;transform:rotate(${p*3.6}deg);transition:transform .9s cubic-bezier(.2,.8,.2,1)">${t}</g><circle cx="115" cy="115" r="84" fill="none" style="stroke:var(--p2);stroke-width:12"/><circle cx="115" cy="115" r="84" fill="none" style="stroke:var(--g);stroke-width:12;stroke-linecap:round;stroke-dasharray:${c*p/100} ${c};transition:stroke-dasharray .9s" transform="rotate(-90 115 115)"/><circle cx="115" cy="115" r="62" style="fill:var(--bg);stroke:var(--l);stroke-width:1"/><text x="115" y="122" text-anchor="middle" style="fill:var(--t);font:700 34px 'IBM Plex Sans Thai'">${Math.floor(p)}%</text><text x="115" y="144" text-anchor="middle" style="fill:var(--m);font:12px 'IBM Plex Sans Thai'">ในตู้เซฟ</text></svg>`}
const row=(a,b)=>`<div class="row"><span class="m">${a}</span><b>${b}</b></div>`;
const unread=()=>S.notifs.filter(n=>!n.r).length;
function note(k,t){if(!S.st.notif||S.notifs.some(n=>n.k==k))return;S.notifs.unshift({k,t,ts:Date.now(),r:0});S.notifs=S.notifs.slice(0,40)}
function auto(){if(!isPaid(S.day)&&saved()<S.goal)note('due'+S.a+'_'+S.day,`${S.name}: วันนี้คุณต้องออม ${f(due())}`);const m=missed();if(m.length)note('miss'+S.a+'_'+S.day,'คุณยังไม่ได้ออมวันนี้ (พลาดวันที่ '+m[0]+')')}
function toast(t,e){const x=$('#toast');x.textContent=t;x.className=e?'e':'';x.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>x.hidden=true,2400)}
function M(h){$('#md').innerHTML=h?`<div class="ov" onclick="if(event.target==this)M()"><div class="sheet">${th(h)}</div></div>`:''}
function beep(){if(!S.st.sound)return;try{const a=new AudioContext(),o=a.createOscillator(),g=a.createGain();o.frequency.value=880;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.15,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.3);o.start();o.stop(a.currentTime+.3)}catch(e){}}
const go=r=>{route=r;render();scrollTo(0,0)};

const home=()=>{const s=saved(),g=S.goal,p=Math.min(100,s/g*100),pd=isPaid(S.day),ms=missed(),pl=plan(g),done=s>=g;
return`<div class="hd"><div><div class="logo">ArmVault</div><p class="m">ออมวันนี้ เพื่อเป้าหมายที่ใหญ่กว่า</p></div><button class="ib" aria-label="การแจ้งเตือน" onclick="go('notif')">${ic('bell')}${unread()?`<i class="bd">${unread()}</i>`:''}</button></div>
${ms.length?`<button class="warn" onclick="A.flex()">คุณพลาดการออมวันที่ ${ms[0]}${ms.length>1?` และอีก ${ms.length-1} วัน`:''} · แตะเพื่อจัดการ</button>`:''}
<section class="card c-vault"><p class="m">เป้าหมายของฉัน</p><h1>${f(g)}</h1><div class="dw">${dial(p)}</div><div class="two"><div><p class="m">ออมแล้ว</p><b>${f(s)}</b></div><div><p class="m">เหลือ</p><b>${f(Math.max(0,g-s))}</b></div></div></section>
<section class="card"><p class="m">วันนี้ · วันที่ ${S.day}</p>${done?`<p class="big" style="margin:6px 0 14px">ถึงเป้าหมายแล้ว 🎉</p><button class="sec" onclick="go('edit')">ตั้งเป้าหมายใหม่</button>`:`<p class="m" style="margin-top:6px">วันนี้ต้องออม</p><p class="big" style="margin-bottom:14px">${f(due())}</p>${pd?`<button class="cta" disabled>${ic('check')} ออมแล้ววันนี้</button>`:`<button class="cta" onclick="A.pay()">${ic('check')} ออมแล้ว</button>`}`}</section>
<div class="grid2"><div class="st"><p class="m">ออมต่อเนื่อง</p><b style="color:var(--y)">🔥 ${streak()} วัน</b></div><div class="st"><p class="m">ออมแล้ว</p><b>${Object.keys(S.paid).length} วัน</b></div><div class="st"><p class="m">เหลืออีก</p><b>${pl.m} วัน</b></div><div class="st"><p class="m">คาดว่าจะถึงเป้าหมาย</p><b style="font-size:15px">${pl.end}</b></div></div>`};

const goal=()=>{const s=saved(),g=S.goal,p=Math.min(100,s/g*100),pl=plan(g);
return`<h2>เป้าหมาย</h2>${poolCard()}<section class="card"><div class="dw">${dial(p,200)}</div>${row('เป้าหมาย',f(g))}${row('ออมแล้ว',f(s))}${row('เหลือ',f(Math.max(0,g-s)))}${row('วันปัจจุบัน','วันที่ '+S.day)}${row('เหลืออีก',pl.m+' วัน')}${row('ยอดสะสมเมื่อครบ',f(pl.tot))}${row('คาดว่าจะถึงเป้าหมาย',pl.end)}</section><button class="cta s" onclick="go('edit')">แก้ไขเป้าหมาย</button>`};

const fdt=d=>d.toLocaleDateString('th-TH-u-ca-gregory',{day:'numeric',month:'short',year:'numeric'});
const approx=d=>{if(d<30)return'';const m=d/30.44;if(m>=12){const y=Math.floor(m/12),r=Math.round(m-y*12);return r>=12?'ประมาณ '+(y+1)+' ปี':'ประมาณ '+y+' ปี'+(r?' '+r+' เดือน':'')}const h=Math.round(m*2)/2,w=Math.floor(h);return'ประมาณ '+w+' เดือน'+(h>w?'ครึ่ง':'')};
const endDate=(mode,k)=>{if(mode=='fix'){const d=new Date();d.setMonth(d.getMonth()+k);return d}return new Date(md(Date.now())+k*864e5)};
function pv(v){const g=Math.floor(+v),s=saved(),M_=$('#em')?$('#em').value:S.mode,mm=Math.floor(+($('#emm')?$('#emm').value:0)),dy=Math.floor(+($('#edy')?$('#edy').value:0));bad2=1;
if(!(g>=1&&g<=1e9))return`<p class="er">กรอกจำนวนเงินตั้งแต่ ฿1 ถึง ฿1,000,000,000</p>`;
if(g<=s)return`<p class="er">เป้าหมายต้องมากกว่ายอดที่ออมแล้ว (${f(s)})</p>`;
const R=g-s,same=M_==S.mode,sd=isPaid(S.day)?S.day+1:S.day;let n,t,u='วัน',per='',nx='',endD;
if(M_=='fix'){if(!(mm>=1&&mm<=R))return`<p class="er">ยอดต่อเดือนต้องอยู่ระหว่าง ฿1 ถึง ${f(R)}</p>`;n=Math.ceil(R/mm);t=s+n*mm;u='เดือน';endD=same?dd(sd+n-1):endDate('fix',n-1)}
else if(M_=='day'){if(!(dy>=1&&dy<=3650))return`<p class="er">ใส่จำนวนวันตั้งแต่ 1 ถึง 3,650</p>`;const m=Math.ceil(R/dy);n=dy;t=s+n*m;per=row('ต้องออมวันละ',f(m));endD=same?dd(sd+n-1):endDate('day',n-1)}
else if(same){const q=plan(g);n=q.m;t=q.tot;endD=dd(q.last)}
else{const b=Math.floor((Math.sqrt(8*s+1)-1)/2);let k=b+1,sum=0;n=0;while(sum<R){sum+=k;k++;n++}t=s+sum;nx=row('วันถัดไปเริ่มที่',f(b+1));endD=endDate('lad',n-1)}
bad2=0;
return`<div class="card" style="margin:0">${row('เป้าหมายใหม่',f(g))}${per}${nx}${row(s>0?'เหลืออีก':(M_=='fix'?'จำนวนเดือนที่ต้องออม':'จำนวนวันที่ต้องออม'),n.toLocaleString('en-US')+' '+u)}${row('ครบกำหนด',fdt(endD))}${row('ยอดสะสมเมื่อครบ',f(t))}${row('ยอดเกินเป้าหมาย',f(t-g))}${s>0?row('ออมแล้ว',f(s)):''}</div>`}
let bad2=0,PEND;
const edit=()=>`<button class="back" onclick="go('goal')">${ic('back')} กลับ</button><h2>แก้ไขเป้าหมาย</h2><p class="m" style="margin-bottom:8px">วิธีออม</p><select id="em" class="sl" onchange="A.emode(this.value)">${[['lad','ออมแบบเพิ่มทุกวัน'],['fix','ออมรายเดือน'],['day','ตั้งจำนวนวัน']].map(([v,l])=>`<option value="${v}"${S.mode==v?' selected':''}>${l}</option>`).join('')}</select><div id="ef"${S.mode=='fix'?'':' hidden'}><p class="m" style="margin:10px 0 8px">ยอดต่อเดือน (บาท)</p><input id="emm" class="in" inputmode="numeric" placeholder="เช่น 5000" value="${S.mode=='fix'?S.m:''}" oninput="A.num(this);A.prev()"></div><div id="ed"${S.mode=='day'?'':' hidden'}><p class="m" style="margin:10px 0 8px">ภายในกี่วัน</p><input id="edy" class="in" inputmode="numeric" placeholder="เช่น 20" value="${S.mode=='day'?plan(S.goal).m||'':''}" oninput="A.num(this);A.prev()"></div><p class="m" style="margin:10px 0 8px">เป้าหมายการออม (บาท)</p><input id="gi" class="in" inputmode="numeric" value="${S.goal}" oninput="A.num(this);A.prev()"><div class="chips">${[10000,50000,100000,200000,300000,500000].map(v=>`<button onclick="A.set(${v})">${f(v)}</button>`).join('')}</div><div id="pv">${pv(S.goal)}</div><button id="cf" class="cta s" style="margin-top:14px" ${bad2?'disabled':''} onclick="A.cfm()">ยืนยันเป้าหมาย</button><p class="m" style="margin-top:10px">ยอดที่ออมไปแล้วจะไม่ถูกรีเซ็ต</p>`;

function stN(d){return isPaid(d)?'p':d==S.day?'t':d>S.day?'f':['comp','spread','part','pooled'].includes(S.fixed[d])?'c':S.fixed[d]=='pool'?'q':'m'}
const cal=()=>{const pl=plan(S.goal),N=Math.max(S.day,pl.sd+pl.m-1);let h='';for(let d=1;d<=N;d++)h+=`<button class="cell ${stN(d)}" id="d${d}" onclick="A.day(${d})"><b>${d}</b>฿${d.toLocaleString('en-US')}${stN(d)=='p'?' ✓':''}</button>`;
return`<h2>ตารางออม</h2><div class="lg"><span><i style="background:var(--g)"></i>ออมแล้ว</span><span><i style="background:var(--y)"></i>วันนี้</span><span><i style="background:var(--p2)"></i>ยังไม่ถึง</span><span><i style="background:var(--r)"></i>พลาด</span></div><div class="cal">${h}</div>`};

const stats=()=>{const ks=Object.keys(S.paid).map(Number);if(!ks.length)return`<h2>สถิติ</h2><div class="card ctr" style="min-height:0"><p class="big">ยังไม่มีข้อมูล</p><p class="m">กด “ออมแล้ว” วันแรก แล้วกราฟจะเริ่มขึ้นที่นี่</p><button class="cta s" onclick="go('home')">ไปหน้าหลัก</button></div>`;
const n=minN(S.goal),N=Math.max(n,S.day),ymax=Math.max(S.goal,cum(N)),W=320,H=170,X=d=>10+(W-20)*d/N,Y=v=>H-8-(H-20)*v/ymax;let c=0,a='',ide='';for(let d=1;d<=S.day;d++){c+=S.paid[d]||0;a+=(d>1?' ':'')+X(d).toFixed(1)+','+Y(c).toFixed(1)}
for(let d=0;d<=N;d+=Math.max(1,Math.floor(N/60)))ide+=X(d).toFixed(1)+','+Y(cum(d)).toFixed(1)+' ';
let best=ks.reduce((b,k)=>S.paid[k]>S.paid[b]?k:b,ks[0]),mis=0;for(let d=(S.base||0)+1;d<S.day;d++)if(!isPaid(d)&&S.fixed[d]!='comp'&&S.fixed[d]!='spread')mis++;
return`<h2>สถิติ</h2><section class="card"><p class="m">ยอดเงินสะสมตามวัน</p><svg viewBox="0 0 ${W} ${H}" width="100%" style="margin:8px 0"><line x1="10" x2="${W-10}" y1="${Y(S.goal)}" y2="${Y(S.goal)}" style="stroke:var(--y);stroke-dasharray:4 4;stroke-width:1.5"/><polyline points="${ide}" style="stroke:var(--m);stroke-opacity:.5;stroke-width:1.5;stroke-dasharray:2 4"/><polyline points="${a}" style="stroke:var(--g);stroke-width:3"/><text x="12" y="${Y(S.goal)-5}" style="fill:var(--y);font:11px 'IBM Plex Sans Thai';stroke:none">เป้าหมาย ${f(S.goal)}</text></svg><div class="lg"><span><i style="background:var(--g)"></i>ยอดสะสมจริง (วันที่ 1–${S.day})</span><span><i style="background:var(--m)"></i>แผนเต็ม</span></div></section>
<div class="grid2"><div class="st"><p class="m">ยอดออมทั้งหมด</p><b>${f(saved())}</b></div><div class="st"><p class="m">ค่าเฉลี่ยต่อวัน</p><b>${f(saved()/ks.length)}</b></div><div class="st"><p class="m">วันที่ออมดีที่สุด</p><b>วันที่ ${best} · ${f(S.paid[best])}</b></div><div class="st"><p class="m">Streak สูงสุด</p><b>🔥 ${maxStreak()} วัน</b></div><div class="st"><p class="m">ออมสำเร็จ</p><b>${ks.length} วัน</b></div><div class="st"><p class="m">พลาด</p><b>${mis} วัน</b></div></div>`};

const tg=(on,a)=>`<button class="tg ${on?'on':''}" role="switch" aria-checked="${!!on}" onclick="${a}"></button>`;
const set=()=>{const s=S.st;return`<h2>ตั้งค่า</h2><section class="card" style="padding:6px 18px"><button class="row" style="width:100%" onclick="go('edit')"><span>แก้ไขเป้าหมาย</span><b>${f(S.goal)} ›</b></button><div class="row"><span>PIN / Security</span>${tg(s.pin,'A.pin()')}</div><div class="row"><span>การแจ้งเตือน</span>${tg(s.notif,'A.tog(\'notif\')')}</div><div class="row"><span>เสียง</span>${tg(s.sound,'A.tog(\'sound\')')}</div><div class="row"><span>โหมดสว่าง</span>${tg(s.theme=='light','A.theme()')}</div><button class="row" style="width:100%" onclick="A.bk()"><span>สำรองข้อมูล</span><b>›</b></button><button class="row dg" style="width:100%" onclick="A.rs()"><span>Reset ข้อมูล</span><b>›</b></button></section><p class="m" style="text-align:center">ArmVault · ข้อมูลเก็บไว้ในเครื่องนี้เท่านั้น</p>`};

const notif=()=>`<button class="back" onclick="go('home')">${ic('back')} กลับ</button><h2>การแจ้งเตือน</h2>${S.notifs.length?S.notifs.map(n=>`<div class="ni ${n.r?'':'u'}"><p>${n.t}</p><p class="m">${new Date(n.ts).toLocaleString('th-TH-u-ca-gregory',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</p></div>`).join(''):`<div class="card ctr" style="min-height:0"><p class="big">ยังไม่มีแจ้งเตือน</p><p class="m">เมื่อถึงเวลาออม ข้อความจะขึ้นที่นี่</p></div>`}`;

const nav=()=>`<nav class="nav">${[['home','home','หน้าหลัก'],['goal','target','เป้าหมาย'],['cal','cal','ตารางออม'],['stats','chart','สถิติ'],['set','set','ตั้งค่า']].map(([r,i,l])=>`<button class="${route==r?'on':''}" onclick="go('${r}')">${ic(i)}<span>${l}</span></button>`).join('')}</nav>`;

const onb=()=>{const pg=[`<div class="ctr"><svg viewBox="0 0 160 120" width="210" style="stroke:none;margin:auto"><ellipse cx="80" cy="70" rx="56" ry="42" fill="#ffb3c7"/><circle cx="48" cy="38" r="12" fill="#ff9db8"/><ellipse cx="132" cy="70" rx="12" ry="16" fill="#ff9db8"/><circle cx="127" cy="70" r="2.5" fill="#a33"/><circle cx="127" cy="78" r="2.5" fill="#a33"/><circle cx="110" cy="54" r="4" fill="#222"/><rect x="62" y="30" width="30" height="5" rx="2.5" fill="#d77"/><circle cx="76" cy="14" r="13" fill="#ffd34d"/><rect x="50" y="104" width="12" height="14" rx="4" fill="#ff9db8"/><rect x="96" y="104" width="12" height="14" rx="4" fill="#ff9db8"/></svg><h1 style="font-size:28px">ออมวันนี้<br>เพื่ออนาคตที่ดีกว่า</h1><p class="m">ตั้งเป้าหมายได้เองตามต้องการ</p><div class="logo">🌱 ArmVault</div></div>`,
`<div class="ctr"><p class="m">วันที่ 1 · วันที่ 2 · วันที่ 3</p><h1>฿1 → ฿2 → ฿3</h1><h2>เริ่มจาก 1 บาท<br>แล้วเพิ่มขึ้นวันละ 1 บาท</h2></div>`,
`<div style="padding-top:40px"><h2>ตั้งเป้าหมายของคุณ</h2><input id="gi" class="in" inputmode="numeric" value="${obg}" placeholder="เช่น 100000" oninput="this.value=this.value.replace(/\\D/g,'');obg=this.value;A.obp()"><div id="pv" style="margin-top:14px"></div></div>`];
return`<div class="ob"><div>${pg[ob]}</div><div><div class="dots">${[0,1,2].map(i=>`<i class="${i==ob?'on':''}"></i>`).join('')}</div><button id="cf" class="cta" onclick="A.nx()">${ob<2?'ถัดไป':'เริ่มออม'}</button></div></div>`};
const lock=()=>`<div class="ctr"><div class="logo">ArmVault</div><p class="m">ใส่ PIN 4 หลัก</p><input class="in" type="password" inputmode="numeric" maxlength="4" style="text-align:center;letter-spacing:12px" oninput="A.unl(this)" autofocus></div>`;

const A={
pay(){if(isPaid(S.day))return;S.paid[S.day]=due();const s=streak();beep();if(s==7||s==30||s==100)note('sk'+S.a+'_'+s,`🔥 คุณออมต่อเนื่องครบ ${s} วันแล้ว!`);toast('ออมแล้ว '+f(S.paid[S.day])+' เข้าตู้เซฟ');
if(saved()>=S.goal){note('goal'+S.a+'_'+S.goal,'🎉 ถึงเป้าหมาย '+f(S.goal)+' แล้ว');M(`<h2>ถึงเป้าหมายแล้ว 🎉</h2><p class="m">คุณออมครบ ${f(S.goal)} ใน ArmVault</p><button class="cta s" style="margin-top:14px" onclick="M()">เยี่ยมเลย</button>`)}render()},

function decorate(){
 try{
  if(typeof loading=='undefined'||loading||!S.onboarded)return;
  if(route=='set')return setRow();
  if(route!='home'||(S.st.pin&&!ul))return;
  const main=document.querySelector('main');if(!main)return;
  main.querySelectorAll('.mvl,.mvr').forEach(e=>e.remove());
  const c=curC();main.classList.toggle('mvh',!!c);
  const sw=main.querySelector('.sw'),dw=main.querySelector('.dw');
  if(!c||!sw||!dw)return;
  const mr=main.getBoundingClientRect(),dt=dw.getBoundingClientRect().top-mr.top,swT=sw.getBoundingClientRect().top-mr.top;
  const mood=moodNow(),stg=stageOf(pct()),pr=c.pr;
  if(S.st.mvOn!==false){
   const L=cloud('left',3,dt-66,42,.3,0)+cloud('right',5,dt-38,32,.26,1.2)
    +dec('coin','left',3,dt+40,26,.55,.3)+dec('star','left',13,dt+88,18,.55,1.1)+dec(pr[0],'left',3,dt+126,26,.55,.6)+dec('star','left',12,dt+170,14,.5,1.7)
    +dec(pr[1],'right',3,dt+50,26,.55,.9)+dec('star','right',12,dt+100,18,.55,.2)+dec('coin','right',3,dt+138,26,.55,1.5)+dec(pr[2],'right',11,dt+176,22,.5,.4);
   const h=swT+14;
   main.insertAdjacentHTML('afterbegin',`<div class="mvl" aria-hidden="true" style="left:0;right:0;top:0;height:${h}px;z-index:0">${L}<svg viewBox="0 0 400 44" preserveAspectRatio="none" style="position:absolute;left:0;bottom:0;width:100%;height:44px;fill:none;stroke:none"><path d="M0 22 Q60 2 130 16 T260 12 T400 8 L400 44 L0 44Z" style="fill:var(--mh1)"/><path d="M0 32 Q80 16 160 28 T320 22 T400 26 L400 44 L0 44Z" style="fill:var(--mh2)"/></svg>${bloom(16,13,'#ff9fc4')}${bloom(38,9,'#fff')}${bloom(74,11,'#ff9fc4')}${bloom(90,15,'#fff')}</div>`);
  }
  const rot=mood=='z'?-6:0,th=pct()*3.6,from=lastA,sc=SC[stg]*.9;
  const zz=mood=='z'?`<div class="mvz" aria-hidden="true" style="position:absolute;left:56px;top:-14px;color:var(--mvd);font:700 14px 'IBM Plex Sans Thai';pointer-events:none">z<span style="font-size:18px">Z</span></div>`:'';
  const cat=`<svg viewBox="-38 -38 76 76" width="76" height="76" style="overflow:visible;stroke:none;fill:none"><g class="mvb"><g transform="rotate(${rot}) scale(${sc})">${body(c,mood,stg)}</g></g></svg>${zz}`;
  const off=[30,42,54,66,78],sz=[12,11,10,9,8],op=[.95,.8,.65,.5,.35];
  let h=piv(from,th,100,76,cat,'mvm',`onclick="MV.tap()" role="img" aria-label="${c.n}"`);
  off.forEach((o,i)=>{if(th-o<8)return;h+=piv(from-o,th-o,96,sz[i],`<svg class="mvs" viewBox="-9 -9 18 18" width="${sz[i]}" height="${sz[i]}" style="overflow:visible;stroke:none;fill:#fff;opacity:${op[i]};animation-delay:${i*.35}s"><path d="M0 -8 L2.4 -2.4 L8 0 L2.4 2.4 L0 8 L-2.4 2.4 L-8 0 L-2.4 -2.4Z"/></svg>`,'mvo','aria-hidden="true"')});
  dw.insertAdjacentHTML('beforeend',h);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{dw.querySelectorAll('.mvr').forEach(r=>{const t=+r.dataset.to;r.style.transform=`rotate(${t}deg)`;r.firstElementChild.style.transform=`rotate(${-t}deg)`})}));
  lastA=th;
 }catch(e){}
}
